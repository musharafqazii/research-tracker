<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Research tracker</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233346b8'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css?v=8">
<!-- deferred: run in order after the page is parsed, without blocking the first paint -->
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5.0.3/dist/email.min.js"></script>
<script defer src="projects.js?v=8"></script>
<script defer src="core.js?v=8"></script>
<script defer src="firebase-config.js?v=8"></script>
<script defer src="email-config.js?v=8"></script>
<script defer src="app.js?v=8"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
  <header class="top">
    <div>
      <nav class="projects" id="projects" aria-label="Projects" hidden></nav>
      <h1 id="pname">Research tracker</h1>
      <p class="goal clamp" id="pgoal"></p>
      <button class="goal-more" id="goalMore" type="button" hidden>Show full aim</button>
    </div>
    <div class="authbox">
      <div class="status" id="status" role="status"><span class="dot"></span><span id="statusText">Loading…</span><span class="rolebadge" id="roleBadge" hidden></span></div>
      <div class="seg preview" id="rolePreview" role="group" aria-label="Preview the tracker as" title="Browser-only preview: switch roles to see both views" hidden>
        <button type="button" data-role="student" aria-pressed="false">Student</button><button type="button" data-role="guide" aria-pressed="false">Guide</button>
      </div>
      <div class="authbtns">
        <button class="btn primary" id="signin" type="button" hidden>Sign in with Google</button>
        <span class="menuwrap">
          <button class="btn ghost small" id="moreBtn" type="button" aria-haspopup="true" aria-expanded="false">More <span class="badge warn" id="badge-manuscript" hidden></span> ▾</button>
          <span class="menu" id="moreMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-act="manuscript">Manuscript claims <small>which results your paper relies on</small></button>
            <button type="button" role="menuitem" data-act="prefs" id="prefsBtn">Email settings <small>what you get emailed, and when</small></button>
            <button type="button" role="menuitem" data-act="snapshot">Download everything <small>a readable copy (.md)</small></button>
            <button type="button" role="menuitem" data-act="week">Download this week's report <small>(.md)</small></button>
            <button type="button" role="menuitem" data-act="backup">Download a backup <small>all records (.json)</small></button>
            <button type="button" role="menuitem" data-act="signout" id="signout">Sign out</button>
          </span>
        </span>
      </div>
    </div>
  </header>

  <section class="pillars" id="pillars" aria-label="Where each item stands" hidden></section>
  <p class="note" id="note" role="alert" hidden></p>

  <nav class="tabs" role="tablist" aria-label="Views" id="tabs">
    <button class="tab" role="tab" type="button" data-view="today" id="tab-today" aria-controls="view-today">Home <span class="badge" id="badge-today" hidden></span></button>
    <button class="tab" role="tab" type="button" data-view="outline" id="tab-outline" aria-controls="view-outline">Items</button>
    <button class="tab" role="tab" type="button" data-view="meetings" id="tab-meetings" aria-controls="view-meetings">Meetings <span class="badge" id="badge-meetings" hidden></span></button>
    <button class="tab" role="tab" type="button" data-view="log" id="tab-log" aria-controls="view-log">Journal</button>
  </nav>

  <main id="main" tabindex="-1">
    <section class="view" id="view-today" role="tabpanel" aria-labelledby="tab-today" hidden></section>
    <section class="view" id="view-outline" role="tabpanel" aria-labelledby="tab-outline" hidden></section>
        <section class="view" id="view-meetings" role="tabpanel" aria-labelledby="tab-meetings" hidden></section>
    <section class="view" id="view-log" role="tabpanel" aria-labelledby="tab-log" hidden></section>
    <section class="view" id="view-manuscript" role="tabpanel" aria-labelledby="tab-manuscript" hidden></section>
    <noscript><p class="loading">This tracker needs JavaScript.</p></noscript>
  </main>
</div>

<dialog id="prefsDialog" aria-labelledby="prefsTitle">
  <form method="dialog" id="prefsForm">
    <div>
      <h2 id="prefsTitle">Email settings</h2>
      <p class="muted small" id="prefsWho"></p>
    </div>
    <fieldset>
      <legend>Right away</legend>
      <label><input type="checkbox" name="reviews"> <span>Review requests, approvals, requested changes, invalidated results and independent checks</span></label>
      <label><input type="checkbox" name="deliverables"> <span>Deliverables written or added by the guide</span></label>
      <label><input type="checkbox" name="decisions"> <span>Decisions requested or recorded</span></label>
      <label><input type="checkbox" name="blockers"> <span>New blockers</span></label>
      <label><input type="checkbox" name="meetings"> <span>Meeting proposals, confirmations and cancellations</span></label>
    </fieldset>
    <fieldset>
      <legend>Comments</legend>
      <label><input type="radio" name="comments" value="immediate"> <span>Email each comment right away</span></label>
      <label><input type="radio" name="comments" value="daily"> <span>Collect them in the daily digest</span></label>
      <label><input type="radio" name="comments" value="off"> <span>Don't email comments</span></label>
    </fieldset>
    <fieldset>
      <legend>Scheduled</legend>
      <label><input type="checkbox" name="daily"> <span>Daily digest of routine activity (about 7 am, only on days something happened)</span></label>
      <label><input type="checkbox" name="reminders"> <span>Reminder when a review or a requested change has waited 3 days or more</span></label>
      <label><input type="checkbox" name="deadlines"> <span>Deadline warnings: 2 days before, on the day, and the day after</span></label>
      <label><input type="checkbox" name="weekly"> <span>Weekly progress report (Sunday evening)</span></label>
    </fieldset>
    <p class="muted small">Your own changes never email you. Stage moves, due dates, links, tasks and lower verification levels are routine: they only appear in the daily digest.</p>
    <div class="formbtns">
      <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
